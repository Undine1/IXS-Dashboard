name: Probe eth_callMany Parity

# Evidence-only shadow probe. It never changes served data, commits, branches,
# deployments, or the production Multicall3 snapshot path.
on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eth-call-many-shadow
  cancel-in-progress: false

jobs:
  probe:
    name: Compare eth_callMany with Multicall3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run exact-block shadow probe
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          MULTICALL3_ADDRESS: ${{ vars.MULTICALL3_ADDRESS }}
          NEXT_PUBLIC_ETH_TOKEN_ADDRESS: ${{ vars.NEXT_PUBLIC_ETH_TOKEN_ADDRESS }}
          NEXT_PUBLIC_POLYGON_TOKEN_ADDRESS: ${{ vars.NEXT_PUBLIC_POLYGON_TOKEN_ADDRESS }}
          NEXT_PUBLIC_BASE_TOKEN_ADDRESS: ${{ vars.NEXT_PUBLIC_BASE_TOKEN_ADDRESS }}
          NEXT_PUBLIC_ETH_BURN_ADDRESSES: ${{ vars.NEXT_PUBLIC_ETH_BURN_ADDRESSES }}
          NEXT_PUBLIC_POLYGON_BURN_ADDRESSES: ${{ vars.NEXT_PUBLIC_POLYGON_BURN_ADDRESSES }}
          NEXT_PUBLIC_BASE_BURN_ADDRESSES: ${{ vars.NEXT_PUBLIC_BASE_BURN_ADDRESSES }}
        run: npm run probe:eth-call-many

      - name: Upload shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-call-many-shadow-${{ github.run_id }}
          path: data/eth_call_many_shadow.json
          if-no-files-found: error
          retention-days: 30
